[project]
site_name = "FastAPI Router Versioning"
site_description = "Router-based API versioning for FastAPI, with per-version docs and a declarative route lifecycle."
site_url = "https://fastapi-router-versioning.matblack81.com/"
repo_url = "https://github.com/matblack81/fastapi-router-versioning"
repo_name = "matblack81/fastapi-router-versioning"
copyright = 'Copyright &copy; 2026 Matteo Nieddu &middot; <a href="https://github.com/matblack81/fastapi-router-versioning/blob/main/LICENSE">MIT License</a>'
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Quick start" = "quickstart.md" },
    { "Adding it to an existing app" = "migrating.md" },
    { "Route lifecycle" = "lifecycle.md" },
    { "How it works" = "how-it-works.md" },
    { "Advanced options" = [
      "advanced/index.md",
      { "Deprecation headers" = "advanced/deprecation-headers.md" },
      { "Latest alias" = "advanced/latest-alias.md" },
      { "Version discovery" = "advanced/version-discovery.md" },
      { "Custom URL format" = "advanced/custom-url-format.md" },
      { "OpenAPI schema hook" = "advanced/openapi-hook.md" },
      { "Validation error status code" = "advanced/validation-error-status-code.md" },
      { "OpenAPI callbacks and webhooks" = "advanced/callbacks-and-webhooks.md" },
      { "Multiple routers" = "advanced/multiple-routers.md" },
      { "Self-hosted assets" = "advanced/self-hosted-assets.md" },
      { "Reverse proxy and sub-apps" = "advanced/reverse-proxy-and-sub-apps.md" },
      { "Callback hook" = "advanced/callback-hook.md" },
    ] },
  ] },
  { "Reference" = "reference.md" },
  { "Examples" = "examples.md" },
  { "Release notes" = "release-notes.md" },
]

[project.theme]
variant = "classic"
logo = "assets/images/logo-header.svg"
favicon = "assets/images/favicon.svg"
custom_dir = "overrides"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
accent = "cyan"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "pink"
accent = "cyan"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matblack81/fastapi-router-versioning"
name = "Source code on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/fastapi-router-versioning/"
name = "fastapi-router-versioning on PyPI"

[[project.extra.social]]
icon = "fontawesome/solid/bug"
link = "https://github.com/matblack81/fastapi-router-versioning/issues"
name = "Report an issue"

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["griffe_typingdoc"]
docstring_section_style = "spacy"
show_root_heading = true
show_root_full_path = false
show_if_no_docstring = true
members_order = "source"
separate_signature = true
unwrap_annotated = true
merge_init_into_class = true
signature_crossrefs = true
show_symbol_type_heading = true
show_symbol_type_toc = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
