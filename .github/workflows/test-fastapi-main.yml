name: Test FastAPI main

# Early warning, not a gate: runs the suite against FastAPI's development branch so that
# routing changes show up before they are released. Never runs on pull requests and is not
# part of any required check.
on:
  schedule:
    # cron every day: FastAPI often releases what lands on master within hours
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

env:
  UV_NO_SYNC: true

jobs:
  test-fastapi-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Dependencies
        run: uv sync --no-dev --group tests

      - name: Install FastAPI from source
        run: uv pip install -U "git+https://github.com/fastapi/fastapi@master"

      - name: Test
        run: uv run --no-sync bash scripts/test.sh
